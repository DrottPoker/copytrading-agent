x-app-database-environment: &app_database_environment
  APP_ENV: production
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-copyagent}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-copyagent}
  DATABASE_URL_DIRECT: postgresql://${POSTGRES_USER:-copyagent}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-copyagent}

services:
  backend:
    build:
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      <<: *app_database_environment
      WORKER_RUN_IN_API_PROCESS: "false"
    expose:
      - "8000"
    volumes:
      - ./backups/postgres:/app/backups/postgres:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  trading-worker:
    build:
      context: ./backend
    command: python -m app.workers.monitor_worker
    env_file:
      - .env
    environment:
      <<: *app_database_environment
      WORKER_ROLE: "trading"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  maintenance-worker:
    build:
      context: ./backend
    command: python -m app.workers.monitor_worker
    env_file:
      - .env
    environment:
      <<: *app_database_environment
      WORKER_ROLE: "maintenance"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      SERVER_API_BASE_URL: http://backend:8000
      DASHBOARD_AUTH_USERNAME: ${DASHBOARD_AUTH_USERNAME}
      DASHBOARD_AUTH_PASSWORD: ${DASHBOARD_AUTH_PASSWORD}
    expose:
      - "3000"
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --save 60 1
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    shm_size: 512mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-copyagent}
      POSTGRES_USER: ${POSTGRES_USER:-copyagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=2GB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - work_mem=8MB
      - -c
      - max_connections=80
      - -c
      - wal_compression=on
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - max_wal_size=2GB
      - -c
      - autovacuum_vacuum_scale_factor=0.05
      - -c
      - autovacuum_analyze_scale_factor=0.02
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile.vps:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  redis_data:
  postgres_data:
