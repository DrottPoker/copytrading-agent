name: copyagent-test

# Host ports stay below 49152: Windows reserves blocks of the dynamic range above it.

services:
  postgres-test:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: copyagent_test
      POSTGRES_USER: copyagent_test
      POSTGRES_PASSWORD: copyagent-test-password
    ports:
      - "127.0.0.1:25432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copyagent_test -d copyagent_test"]
      interval: 2s
      timeout: 5s
      retries: 20

  redis-test:
    image: redis:7.4.11-alpine
    command: redis-server --appendonly no --save ""
    ports:
      - "127.0.0.1:26379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 20
