name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/constraints.txt
            backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -c constraints.txt -e ".[dev]"
      # Each check runs even when an earlier one fails, so one run reports every problem.
      - name: Lint
        if: ${{ !cancelled() }}
        run: python -m ruff check app tests
      - name: Format
        if: ${{ !cancelled() }}
        run: python -m ruff format --check app tests
      - name: Type check
        if: ${{ !cancelled() }}
        run: python -m mypy
      - name: Dependency audit
        if: ${{ !cancelled() }}
        run: python -m pip_audit --skip-editable
      - name: Compile
        if: ${{ !cancelled() }}
        run: python -m compileall -q app

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: copyagent_test
          POSTGRES_USER: copyagent_test
          POSTGRES_PASSWORD: copyagent-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U copyagent_test -d copyagent_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://copyagent_test:copyagent-test-password@127.0.0.1:5432/copyagent_test
      DATABASE_URL_DIRECT: postgresql://copyagent_test:copyagent-test-password@127.0.0.1:5432/copyagent_test
      TEST_DATABASE_URL: postgresql+asyncpg://copyagent_test:copyagent-test-password@127.0.0.1:5432/copyagent_test
      REDIS_URL: redis://127.0.0.1:6379/15
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      DASHBOARD_AUTH_ENABLED: "false"
      WORKER_RUN_IN_API_PROCESS: "false"
      LIVE_TRADING_ENABLED: "false"
      LIVE_TRADING_COPY_ENABLED: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/constraints.txt
            backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -c constraints.txt -e ".[dev]"
      - run: python -m alembic upgrade head
      - run: python -m pytest tests -q --cov=app --cov-report=term
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint
      - name: Type check
        if: ${{ !cancelled() }}
        run: npm run typecheck
      - name: Tests
        if: ${{ !cancelled() }}
        run: npm run test:coverage
      - name: Production dependency audit
        if: ${{ !cancelled() }}
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build
