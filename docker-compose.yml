services:
  backend:
    build:
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - path: .env
        required: false
    environment:
      WORKER_RUN_IN_API_PROCESS: "false"
    ports:
      - "8000:8000"
    depends_on:
      - redis

  trading-worker:
    build:
      context: ./backend
    command: python -m app.workers.monitor_worker
    env_file:
      - path: .env
        required: false
    environment:
      WORKER_ROLE: "trading"
    depends_on:
      - redis

  maintenance-worker:
    build:
      context: ./backend
    command: python -m app.workers.monitor_worker
    env_file:
      - path: .env
        required: false
    environment:
      WORKER_ROLE: "maintenance"
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
    environment:
      SERVER_API_BASE_URL: http://backend:8000
      DASHBOARD_AUTH_USERNAME: ${DASHBOARD_AUTH_USERNAME:-admin}
      DASHBOARD_AUTH_PASSWORD: ${DASHBOARD_AUTH_PASSWORD:-change-me}
    ports:
      - "3000:3000"
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly no --save ""
    expose:
      - "6379"

  caddy:
    image: caddy:2-alpine
    ports:
      - "8080:8080"
      - "8001:8001"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  caddy_data:
  caddy_config:
