x-app-database-environment: &app_database_environment
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-copyagent}:${POSTGRES_PASSWORD:-copyagent-local-dev-password}@postgres:5432/${POSTGRES_DB:-copyagent}
  DATABASE_URL_DIRECT: postgresql://${POSTGRES_USER:-copyagent}:${POSTGRES_PASSWORD:-copyagent-local-dev-password}@postgres:5432/${POSTGRES_DB:-copyagent}

services:
  backend:
    build:
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app_database_environment
      WORKER_RUN_IN_API_PROCESS: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./backups/postgres:/app/backups/postgres:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  trading-worker:
    build:
      context: ./backend
    command: python -m app.workers.monitor_worker
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app_database_environment
      WORKER_ROLE: "trading"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  maintenance-worker:
    build:
      context: ./backend
    command: python -m app.workers.monitor_worker
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app_database_environment
      WORKER_ROLE: "maintenance"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      SERVER_API_BASE_URL: http://backend:8000
      DASHBOARD_AUTH_USERNAME: ${DASHBOARD_AUTH_USERNAME:-admin}
      DASHBOARD_AUTH_PASSWORD: ${DASHBOARD_AUTH_PASSWORD:-change-me}
      DASHBOARD_AUTH_ENABLED: ${DASHBOARD_AUTH_ENABLED:-true}
    ports:
      - "3000:3000"
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      backend:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly no --save ""
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  postgres:
    image: postgres:18-alpine
    shm_size: 512mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-copyagent}
      POSTGRES_USER: ${POSTGRES_USER:-copyagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-copyagent-local-dev-password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  postgres-backup:
    image: postgres:18-alpine
    command: sh /usr/local/bin/postgres-backup-loop.sh
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-copyagent}
      POSTGRES_USER: ${POSTGRES_USER:-copyagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-copyagent-local-dev-password}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_DIR: /backups
      POSTGRES_HOST: postgres
    volumes:
      - ./backups/postgres:/backups
      - ./infra/postgres-backup-loop.sh:/usr/local/bin/postgres-backup-loop.sh:ro
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    ports:
      - "8080:8080"
      - "8001:8001"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
